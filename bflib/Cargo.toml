[package]
name = "bflib"
version.workspace = true
edition = "2024"

[lib]
name = "bflib"
crate-type = ["cdylib"]

[dependencies]
anyhow = { workspace = true }
arcstr = { workspace = true }
bfprotocols = { version = "2.0", path = "../bfprotocols" }
bytes = { workspace = true }
chrono = { workspace = true }
compact_str = { workspace = true }
crossbeam = { workspace = true }
dcso3 = { version = "0.2", path = "../dcso3", features = ["perf"] }
enumflags2 = { workspace = true, features = ["serde"] }
futures = { workspace = true }
fxhash = { workspace = true }
hdrhistogram = { workspace = true }
humantime = { workspace = true }
immutable-chunkmap = { workspace = true }
indexmap = { workspace = true }
log = { workspace = true }
mlua = { version = "0.9.9", features = ["lua51", "module", "serialize"] }
nalgebra = { workspace = true }
netidx = { workspace = true }
netidx-protocols = { workspace = true }
netidx-archive = { workspace = true }
once_cell = { workspace = true }
parking_lot = { workspace = true }
paste = { workspace = true }
rand = { workspace = true }
regex = { workspace = true }
serde_derive = { workspace = true }
serde_json = { workspace = true }
serde = { workspace = true }
simplelog = { workspace = true }
smallvec = { workspace = true }
tokio = { workspace = true }
image = "0.25"
ab_glyph = "0.2"
base64 = { workspace = true }
http-body-util = "0.1"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "multipart"] }
zip = "0.6.6"
zstd = { workspace = true }
