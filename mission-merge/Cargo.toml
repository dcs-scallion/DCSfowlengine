[package]
name = "mission-merge"
version = "0.1.0"
edition = "2021"
description = "Copy leftover groups and trigger zones from one DCS mission Lua file into another. Standalone; does not use or modify bftools."

[[bin]]
name = "mission-merge"

[workspace]

[dependencies]
anyhow = "1"
clap = { version = "4.4.18", features = ["derive"] }
env_logger = "0.11.0"
log = "0.4.20"
mlua = { version = "0.9.9", features = ["lua51", "vendored"] }
zip = "0.6.6"
